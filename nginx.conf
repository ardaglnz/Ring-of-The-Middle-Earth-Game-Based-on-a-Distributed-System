worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Coordinator: order/state-mutating requests always go to go-1.
    # pendingOrders and fastForwardVotes live in go-1's memory only.
    upstream coordinator {
        server go-1:8080;
    }

    # All 3 instances for read-only and SSE requests.
    # ip_hash ensures a player's SSE connection stays on the same instance.
    upstream game_servers {
        ip_hash;
        server go-1:8080;
        server go-2:8080;
        server go-3:8080;
    }

    server {
        listen 80;

        # --- State-mutating endpoints → always go-1 (coordinator) ---

        location = /order {
            proxy_pass http://coordinator;
            proxy_set_header Host $host;
        }

        location = /game/start {
            proxy_pass http://coordinator;
            proxy_set_header Host $host;
        }

        location = /game/fast-forward {
            proxy_pass http://coordinator;
            proxy_set_header Host $host;
        }

        # --- Read-only game endpoints → any instance ---

        location = /game/state {
            proxy_pass http://game_servers;
            proxy_set_header Host $host;
        }

        location /orders/ {
            proxy_pass http://game_servers;
            proxy_set_header Host $host;
        }

        location /analysis/ {
            proxy_pass http://game_servers;
            proxy_set_header Host $host;
        }

        location = /health {
            proxy_pass http://game_servers;
            proxy_set_header Host $host;
        }

        # --- SSE — ip_hash keeps the player on the same instance ---
        location = /events {
            proxy_pass http://game_servers;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_set_header X-Accel-Buffering no;
        }

        # --- Static UI files — catch-all LAST ---
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}