<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a1008"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <!-- Region glow filters -->
    <filter id="glowFree" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowNeutral" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Marker for path arrows -->
    <marker id="pathDot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="4" markerHeight="4">
      <circle cx="3" cy="3" r="2" fill="#d4a85344"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="url(#bgGrad)"/>

  <!-- Atmospheric background elements -->
  <circle cx="780" cy="580" r="120" fill="#1a0000" opacity="0.3"/>
  <circle cx="100" cy="150" r="80" fill="#0a1a0a" opacity="0.2"/>
  <circle cx="450" cy="300" r="100" fill="#0a0a1a" opacity="0.15"/>

  <!-- ============ PATHS ============ -->
  <g id="paths" stroke="#d4a85333" stroke-width="1.5" fill="none" stroke-dasharray="6,4">
    <!-- 1. shire-to-bree -->
    <line x1="80" y1="144" x2="220" y2="160"/>
    <!-- 2. bree-to-weathertop -->
    <line x1="220" y1="160" x2="300" y2="176"/>
    <!-- 3. bree-to-rivendell -->
    <line x1="220" y1="160" x2="380" y2="144"/>
    <!-- 4. bree-to-tharbad -->
    <line x1="220" y1="160" x2="180" y2="280"/>
    <!-- 5. shire-to-tharbad -->
    <line x1="80" y1="144" x2="180" y2="280"/>
    <!-- 6. weathertop-to-rivendell -->
    <line x1="300" y1="176" x2="380" y2="144"/>
    <!-- 7. rivendell-to-moria -->
    <line x1="380" y1="144" x2="420" y2="256"/>
    <!-- 8. rivendell-to-lothlorien -->
    <line x1="380" y1="144" x2="480" y2="320"/>
    <!-- 9. moria-to-lothlorien -->
    <line x1="420" y1="256" x2="480" y2="320"/>
    <!-- 10. lothlorien-to-emyn-muil -->
    <line x1="480" y1="320" x2="550" y2="336"/>
    <!-- 11. lothlorien-to-rohan-plains -->
    <line x1="480" y1="320" x2="350" y2="416"/>
    <!-- 12. rohan-plains-to-fangorn -->
    <line x1="350" y1="416" x2="280" y2="360"/>
    <!-- 13. rohan-plains-to-edoras -->
    <line x1="350" y1="416" x2="380" y2="480"/>
    <!-- 14. rohan-plains-to-minas-tirith -->
    <line x1="350" y1="416" x2="520" y2="520"/>
    <!-- 15. fangorn-to-isengard -->
    <line x1="280" y1="360" x2="250" y2="416"/>
    <!-- 16. isengard-to-rohan-plains -->
    <line x1="250" y1="416" x2="350" y2="416"/>
    <!-- 17. tharbad-to-fords-of-isen -->
    <line x1="180" y1="280" x2="200" y2="384"/>
    <!-- 18. fords-of-isen-to-isengard -->
    <line x1="200" y1="384" x2="250" y2="416"/>
    <!-- 19. fords-of-isen-to-helms-deep -->
    <line x1="200" y1="384" x2="220" y2="464"/>
    <!-- 20. fords-of-isen-to-edoras -->
    <line x1="200" y1="384" x2="380" y2="480"/>
    <!-- 21. edoras-to-helms-deep -->
    <line x1="380" y1="480" x2="220" y2="464"/>
    <!-- 22. helms-deep-to-isengard -->
    <line x1="220" y1="464" x2="250" y2="416"/>
    <!-- 23. edoras-to-minas-tirith -->
    <line x1="380" y1="480" x2="520" y2="520"/>
    <!-- 24. emyn-muil-to-dead-marshes -->
    <line x1="550" y1="336" x2="580" y2="400"/>
    <!-- 25. emyn-muil-to-ithilien -->
    <line x1="550" y1="336" x2="620" y2="480"/>
    <!-- 26. dead-marshes-to-ithilien -->
    <line x1="580" y1="400" x2="620" y2="480"/>
    <!-- 27. dead-marshes-to-mordor -->
    <line x1="580" y1="400" x2="780" y2="576"/>
    <!-- 28. ithilien-to-minas-tirith -->
    <line x1="620" y1="480" x2="520" y2="520"/>
    <!-- 29. ithilien-to-osgiliath -->
    <line x1="620" y1="480" x2="600" y2="544"/>
    <!-- 30. ithilien-to-cirith-ungol -->
    <line x1="620" y1="480" x2="720" y2="480"/>
    <!-- 31. minas-tirith-to-osgiliath -->
    <line x1="520" y1="520" x2="600" y2="544"/>
    <!-- 32. osgiliath-to-minas-morgul -->
    <line x1="600" y1="544" x2="680" y2="560"/>
    <!-- 33. minas-morgul-to-cirith-ungol -->
    <line x1="680" y1="560" x2="720" y2="480"/>
    <!-- 34. minas-morgul-to-mordor -->
    <line x1="680" y1="560" x2="780" y2="576"/>
    <!-- 35. cirith-ungol-to-mordor -->
    <line x1="720" y1="480" x2="780" y2="576"/>
    <!-- 36. cirith-ungol-to-mount-doom -->
    <line x1="720" y1="480" x2="820" y2="624"/>
    <!-- 37. mordor-to-mount-doom -->
    <line x1="780" y1="576" x2="820" y2="624"/>
  </g>

  <!-- ============ REGIONS ============ -->

  <!-- FREE_PEOPLES regions (blue-gold) -->
  <g filter="url(#glowFree)">
    <!-- the-shire -->
    <circle cx="80" cy="144" r="14" fill="#1a2a4a" stroke="#4a9eff" stroke-width="2"/>
    <text x="80" y="126" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#4a9eff">The Shire</text>

    <!-- rivendell -->
    <circle cx="380" cy="144" r="14" fill="#1a2a4a" stroke="#4a9eff" stroke-width="2"/>
    <text x="380" y="126" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#4a9eff">Rivendell</text>

    <!-- fangorn -->
    <circle cx="280" cy="360" r="12" fill="#1a2a4a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="280" y="345" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#4a9eff">Fangorn</text>

    <!-- rohan-plains -->
    <circle cx="350" cy="416" r="12" fill="#1a2a4a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="350" y="440" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#4a9eff">Rohan Plains</text>

    <!-- helms-deep -->
    <rect x="206" y="452" width="28" height="24" rx="4" fill="#1a2a4a" stroke="#4a9eff" stroke-width="2"/>
    <text x="220" y="488" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#4a9eff">Helm's Deep</text>

    <!-- edoras -->
    <circle cx="380" cy="480" r="12" fill="#1a2a4a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="380" y="500" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#4a9eff">Edoras</text>

    <!-- lothlorien -->
    <circle cx="480" cy="320" r="14" fill="#1a2a4a" stroke="#4a9eff" stroke-width="2"/>
    <text x="480" y="305" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#4a9eff">Lothlórien</text>

    <!-- minas-tirith -->
    <rect x="506" y="508" width="28" height="24" rx="4" fill="#1a2a4a" stroke="#4a9eff" stroke-width="2"/>
    <text x="520" y="545" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#4a9eff">Minas Tirith</text>
  </g>

  <!-- NEUTRAL regions (silver/white) -->
  <g filter="url(#glowNeutral)">
    <!-- bree -->
    <circle cx="220" cy="160" r="12" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="220" y="145" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Bree</text>

    <!-- tharbad -->
    <circle cx="180" cy="280" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="180" y="268" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Tharbad</text>

    <!-- weathertop -->
    <circle cx="300" cy="176" r="12" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="300" y="162" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Weathertop</text>

    <!-- fords-of-isen -->
    <circle cx="200" cy="384" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="158" y="384" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="#aaa">Fords of Isen</text>

    <!-- moria -->
    <circle cx="420" cy="256" r="12" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="420" y="244" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Moria</text>

    <!-- dead-marshes -->
    <circle cx="580" cy="400" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="580" y="388" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Dead Marshes</text>

    <!-- emyn-muil -->
    <circle cx="550" cy="336" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="550" y="324" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Emyn Muil</text>

    <!-- ithilien -->
    <circle cx="620" cy="480" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="620" y="468" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Ithilien</text>

    <!-- osgiliath -->
    <circle cx="600" cy="544" r="10" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="600" y="564" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#aaa">Osgiliath</text>
  </g>

  <!-- SHADOW regions (red/crimson) -->
  <g filter="url(#glowShadow)">
    <!-- isengard -->
    <rect x="236" y="404" width="28" height="24" rx="4" fill="#2a0a0a" stroke="#c0392b" stroke-width="2"/>
    <text x="250" y="398" text-anchor="middle" font-family="Cinzel,serif" font-size="9" fill="#c0392b">Isengard</text>

    <!-- minas-morgul -->
    <rect x="666" y="548" width="28" height="24" rx="4" fill="#2a0a0a" stroke="#c0392b" stroke-width="2"/>
    <text x="680" y="584" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="#c0392b">Minas Morgul</text>

    <!-- cirith-ungol -->
    <circle cx="720" cy="480" r="12" fill="#2a0a0a" stroke="#c0392b" stroke-width="2"/>
    <text x="720" y="468" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="#c0392b">Cirith Ungol</text>

    <!-- mordor -->
    <circle cx="780" cy="576" r="16" fill="#2a0a0a" stroke="#c0392b" stroke-width="2.5"/>
    <text x="780" y="600" text-anchor="middle" font-family="Cinzel,serif" font-size="11" fill="#c0392b">Mordor</text>

    <!-- mount-doom (volcanic glow) -->
    <circle cx="820" cy="624" r="14" fill="#3a0a00" stroke="#ff6600" stroke-width="2.5"/>
    <circle cx="820" cy="624" r="8" fill="#ff4400" opacity="0.3"/>
    <text x="820" y="648" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#ff6600" font-weight="bold">Mount Doom</text>
  </g>

  <!-- ============ DECORATIVE ELEMENTS ============ -->

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="Cinzel,serif" font-size="22" fill="#d4a853" opacity="0.6" letter-spacing="3">MIDDLE EARTH</text>

  <!-- Compass -->
  <g transform="translate(920,60)" opacity="0.4">
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#d4a853" stroke-width="1"/>
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#d4a853" stroke-width="1"/>
    <text x="0" y="-25" text-anchor="middle" font-family="Cinzel,serif" font-size="10" fill="#d4a853">N</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30,720)" opacity="0.5" font-family="Crimson Text,serif" font-size="10" fill="#888">
    <circle cx="0" cy="0" r="5" fill="#1a2a4a" stroke="#4a9eff" stroke-width="1.5"/>
    <text x="12" y="4">Free Peoples</text>
    <circle cx="0" cy="18" r="5" fill="#1a1a2a" stroke="#888" stroke-width="1.5"/>
    <text x="12" y="22">Neutral</text>
    <circle cx="0" cy="36" r="5" fill="#2a0a0a" stroke="#c0392b" stroke-width="1.5"/>
    <text x="12" y="40">Shadow</text>
    <circle cx="0" cy="54" r="5" fill="#3a0a00" stroke="#ff6600" stroke-width="1.5"/>
    <text x="12" y="58">Volcanic</text>
  </g>
</svg>
